name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Assemble Android project
        run: |
          mkdir -p app/src/main/java/com/example/batteryguard
          cp MainActivity.java GuardService.java app/src/main/java/com/example/batteryguard/
          sed 's/ package="com.example.batteryguard"//' AndroidManifest.xml > app/src/main/AndroidManifest.xml
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'BatteryGuard'
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.batteryguard'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.batteryguard'
                  minSdk 29
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOT

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryGuard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
